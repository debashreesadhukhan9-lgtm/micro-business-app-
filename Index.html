<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Business App</title>
</head>
<body>
    <div style="font-family: sans-serif; padding: 20px;">
        <h2 style="color: #333;">My Business</h2>
        
        <!-- Summary Cards -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <div style="background-color: #ffebee; padding: 15px; border-radius: 10px; width: 30%; text-align: center;">
                <div style="font-size: 12px; color: #c62828;">To Collect</div>
                <div style="font-size: 18px; font-weight: bold; color: #d32f2f;">₹2,500</div>
            </div>
            <div style="background-color: #e8f5e9; padding: 15px; border-radius: 10px; width: 30%; text-align: center;">
                <div style="font-size: 12px; color: #2e7d32;">Earned</div>
                <div style="font-size: 18px; font-weight: bold; color: #388e3c;">₹10,000</div>
            </div>
            <div style="background-color: #e3f2fd; padding: 15px; border-radius: 10px; width: 30%; text-align: center;">
                <div style="font-size: 12px; color: #1565c0;">Orders</div>
                <div style="font-size: 18px; font-weight: bold; color: #1976d2;">3</div>
            </div>
        </div>

        <!-- Action Button -->
        <a href="neworder.html">
            <button style="width: 100%; background-color: #4caf50; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;">
                + New Order
            </button>
        </a>
    </div>
</body>
</html>
